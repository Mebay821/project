    <main>
        <h2>ADD NEIGHBOR</h2>
        <P>In this page you can add your neighbors to help them know their schedules.</P>
        <form action="dashboard.html" method="GET">
                    <div class="form-group">
                       <label for="district-name">Neighbor Name:</label>
                         <input type="text" id="district-name" name="district-name" required placeholder="e.g., Rowan" minlength="3">
                         </div>
                    <div class="form-group">
                        <label for="user-email">Your Email:</label>
                        <input type="email" id="user-email" name="user-email" required placeholder="e.g., you@example.com">
                    </div>
                    <div class="form-group">
                        <label for="issue-details">Disruption Details:</label>
                        <textarea id="issue-details" name="issue-details" required placeholder="Please provide details about the disruption..." rows="4"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">+ADD</button>
                </form>
            </div>
